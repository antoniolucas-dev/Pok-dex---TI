<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokédex · UC33</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="pokedex">
    <div class="luzes" aria-hidden="true">
      <span class="lente"></span>
      <span class="led led-vermelho"></span>
      <span class="led led-amarelo"></span>
      <span class="led led-verde"></span>
    </div>

    <section class="tela">
      <p id="aviso" class="aviso" hidden></p>
      <img id="imagem" alt="" hidden>
      <p class="identidade">
        <span id="numero">#---</span>
        <strong id="nome">---</strong>
      </p>
      <ul id="tipos" class="tipos"></ul>
    </section>

    <form id="busca" class="busca">
      <input name="termo" placeholder="nome ou número, ex.: pikachu ou 25" maxlength="40" required autocomplete="off">
      <button type="submit">Buscar</button>
    </form>

    <div class="navegacao">
      <button id="anterior" type="button">◀ Anterior</button>
      <button id="aleatorio" type="button">🎲 Aleatório</button>
      <button id="proximo" type="button">Próximo ▶</button>
    </div>

    <section class="historico" id="secao-historico" hidden>
      <h2>Vistos recentemente</h2>
      <ul id="historico"></ul>
    </section>

    <p class="dica">Dica: use as setas ← → do teclado</p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
